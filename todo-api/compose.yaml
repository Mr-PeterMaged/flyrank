services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      LLM_STUB: ${LLM_STUB:-0}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: http://ollama:11434/v1/
      LLM_API_KEY: ollama
      LLM_MODEL: gemma3:1b
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    volumes: [taskdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 10
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskdata:
  ollama-data:
